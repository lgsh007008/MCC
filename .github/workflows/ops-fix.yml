# 临时应急：磁盘打满导致 Redis 无法落盘（MISCONF）、限流写入失败 → 登录 500。
# 处置：清理未使用镜像与构建缓存 → 重启 redis 清掉 stop-writes 标记 → 验证落盘。用完删除。
name: OpsFix

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 清理磁盘并恢复 Redis
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo '=== before ==='
            df -h / | tail -1
            docker system df
            echo '=== prune images ==='
            docker image prune -af
            echo '=== prune build cache ==='
            docker builder prune -af
            echo '=== after ==='
            df -h / | tail -1
            docker system df
            echo '=== restart redis ==='
            docker restart mcc-redis-1
            sleep 5
            docker exec mcc-redis-1 redis-cli PING
            docker exec mcc-redis-1 redis-cli SET __ops_probe ok EX 30
            docker exec mcc-redis-1 redis-cli BGSAVE
            sleep 2
            echo "lastsave=$(docker exec mcc-redis-1 redis-cli LASTSAVE)"
            echo '=== containers ==='
            cd /opt/mcc
            docker compose --env-file .env.prod -f docker-compose.prod.yml ps
            echo '=== redis log tail ==='
            docker logs mcc-redis-1 --tail 10 2>&1
