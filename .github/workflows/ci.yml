# CI 门禁（技术方案 §10：lint + 类型检查 + 构建 + 单测 + 契约校验 + E2E 冒烟）
# 覆盖：数据库迁移与 Prisma Client 生成、OpenAPI 契约校验、全仓 lint（含 §4.2 模块边界规则）、
# 类型检查（server / shared / db）、全仓构建（server 的 NodeNext 编译问题只能由构建暴露）、
# 单测与集成测试（server / shared）、E2E 冒烟（web + server 由 Playwright 本机拉起）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mcc?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 数据库迁移 + Prisma Client 生成（packages/db）
        working-directory: packages/db
        run: |
          pnpm prisma migrate deploy
          pnpm prisma generate

      - name: 契约校验（openapi.json 与实现同步，ADR-006）
        run: |
          pnpm --filter @mcc/server run gen:openapi
          git diff --exit-code -- packages/shared/openapi.json

      - name: Lint（含 §4.2 模块边界规则）
        run: pnpm lint

      - name: 类型检查（server / shared / db）
        run: pnpm --filter @mcc/server --filter @mcc/shared --filter @mcc/db run typecheck

      - name: 构建（全仓）
        run: pnpm build

      - name: 单测与集成测试（server / shared）
        run: pnpm --filter @mcc/server --filter @mcc/shared run test

      - name: E2E 冒烟（Playwright：web + server 本机拉起）
        run: |
          pnpm --filter @mcc/web exec playwright install --with-deps chromium
          pnpm --filter @mcc/server run seed
          pnpm --filter @mcc/web run test:e2e