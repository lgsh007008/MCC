# 一次性应急恢复（用完删除）：v0.1.22 发布在 compose pull 阶段失败，web/server 处于停止状态，
# 数据库迁移尚未执行。此工作流把服务器回滚到 v0.1.21 并重新启动容器。
name: Restore

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: 回滚到 v0.1.21 并启动容器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/mcc
            git fetch origin --tags --force
            git checkout --force v0.1.21
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=v0.1.21/' .env.prod
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
            docker compose --env-file .env.prod -f docker-compose.prod.yml ps
            curl -s -o /dev/null -w 'local-web=%{http_code}\n' http://localhost/login || true
