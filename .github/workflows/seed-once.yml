# 一次性初始化（用完即删）：在生产执行 seed 建平台账号，并核对租户/套餐/平台账号。
# 复用 Deploy 的 SSH secrets，避免本地直连生产。
name: SeedOnce

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: 执行 seed 并核对
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/mcc
            compose() { docker compose --env-file .env.prod -f docker-compose.prod.yml "$@"; }

            echo "===== 当前镜像 ====="
            grep '^IMAGE_TAG=' .env.prod

            echo "===== 执行 seed ====="
            compose run --rm --no-deps server pnpm run seed

            echo "===== 核对 tenants ====="
            compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select id, code, name, status from tenants;"'

            echo "===== 核对 plans ====="
            compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select id, name, max_accounts, status from plans;"'

            echo "===== 核对 platform_users ====="
            compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select username, role, status from platform_users;"'

            echo "===== 核对 tenants.plan_id 与 plans.id ====="
            compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select t.code, t.plan_id, p.name as plan_name from tenants t left join plans p on p.id = t.plan_id;"'

            echo "===== 容器状态 ====="
            compose ps
