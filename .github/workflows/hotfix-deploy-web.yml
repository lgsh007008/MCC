# 临时发布通道：仅构建并发布 web（server 未变更，仍用 v0.1.27 运行）。
# 触发方式：修改本文件并推送；发布完成后可删除。
name: Hotfix deploy web

on:
  push:
    paths:
      - '.github/workflows/hotfix-deploy-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            API_INTERNAL_URL=http://server:3001
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/web:v0.1.28
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 发布 web
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/mcc
            if docker ps --format '{{.Image}}' | grep -q 'web:v0.1.28'; then
              echo 'web 已是 v0.1.28，跳过发布'
              exit 0
            fi
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=v0.1.28/' .env.prod
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull web
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-deps web
            sleep 5
            docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
