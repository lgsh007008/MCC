# 生产发布（技术方案 §9.5）：单人阶段单机单环境。
# 打 v* tag（或手动指定 tag）→ 构建 server/web 镜像推送阿里云 ACR → 服务器拉镜像发布。
# 服务器上的 /opt/mcc 是仓库的 git clone，发布前先 checkout 到目标 tag（编排与脚本随仓库走）。
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要部署的 tag（如 v0.1.0）
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          # 阿里云 ACR 个人版不支持 OCI provenance / SBOM 附加清单（push 会报 unknown manifest class）
          provenance: false
          sbom: false
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/server:${{ github.event.inputs.tag || github.ref_name }}
          # 依赖层与源码层分离后，跨次构建复用缓存，只重建变更层
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: 构建并推送 web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            API_INTERNAL_URL=http://server:3001
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/web:${{ github.event.inputs.tag || github.ref_name }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 发布到服务器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/mcc
            git fetch origin --tags --force
            git checkout --force "${{ github.event.inputs.tag || github.ref_name }}"
            chmod +x deploy/*.sh
            ./deploy/deploy.sh "${{ github.event.inputs.tag || github.ref_name }}"
